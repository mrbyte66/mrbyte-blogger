name: Özellik isteği
description: Yeni bir kullanıcı özelliği öner
title: "özellik: "
body:
  - type: textarea
    id: need
    attributes:
      label: İhtiyaç
      description: Kullanıcı ne yapmak istiyor?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Beklenen sonuç
      description: Özelliğin en küçük işe yarar halini anlat.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Tamamlanma ölçütü
      description: Özelliğin çalıştığını nasıl anlayacağız?
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: İlgili işler ve kapsam
      description: Bağımlılıkları ve bu işe dahil olmayanları belirt.
    validations:
      required: false
