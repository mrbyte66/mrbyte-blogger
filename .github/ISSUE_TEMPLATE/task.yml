name: Teknik görev
description: Bakım veya teknik çalışma kaydı aç
title: "görev: "
labels: ["task"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Hedef
      description: Bu görev sonunda ne elde edeceğiz?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Tamamlanma ölçütü
      description: Kontrol edilebilir sonuçları ve gerekli testleri yaz.
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Bağımlılıklar ve etkilenen alanlar
      description: İlgili işleri ve etkilenecek bölümleri belirt.
    validations:
      required: false
  - type: dropdown
    id: priority
    attributes:
      label: Öncelik
      options:
        - P2 — Normal
        - P1 — Yüksek
        - P0 — Acil canlı hatası
        - P3 — Düşük
    validations:
      required: true
  - type: dropdown
    id: points
    attributes:
      label: Büyüklük puanı
      options:
        - "1 — Çok küçük"
        - "2 — Küçük"
        - "3 — Orta"
        - "5 — Büyük"
        - "8 — Alt işlere böl"
    validations:
      required: true
  - type: textarea
    id: coordination
    attributes:
      label: İş sırası ve çakışma
      description: Önkoşul issue, etkilenen alanlar ve paralel uygunluk. Yoksa Yok yaz.
      placeholder: "Önkoşul: Yok. Alan: frontend. Paralel: uygun."
    validations:
      required: true
