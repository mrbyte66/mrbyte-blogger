name: Bug
description: Report a reproducible defect
title: "bug: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What is wrong, and what should happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact steps, route, and relevant account/state.
      placeholder: "1. Open …\n2. Select …\n3. Observe …"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that prove the fix.
      placeholder: "- [ ] …"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Context and constraints
      description: Related issues, affected areas, and anything explicitly out of scope.
    validations:
      required: false
