# Release images (#22): build, scan, push to GHCR, sign keylessly and publish a release manifest.
# On main this runs only after CI passed for the same commit, so images always come from tested sources.
# Pull requests that change a Dockerfile or this workflow only build and scan (nothing is pushed or signed).
# Third-party actions are pinned by commit SHA because this workflow can push and sign.
name: Images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Push and sign only for main after a green CI run (or a manual run on main).
  PUBLISH: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}

jobs:
  image:
    name: ${{ matrix.app }} image
    # A failed CI run on main produces no images at all.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR (GITHUB_TOKEN; no stored secrets)
      id-token: write   # keyless cosign signature via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/satir-${{ matrix.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (local, for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          load: true
          tags: ${{ steps.name.outputs.image }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Critical findings that already have a fix fail the job; unfixed base-image CVEs are reported, not blocking.
      - name: Trivy scan (critical)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:sha-${{ env.SOURCE_SHA }}
            ${{ steps.name.outputs.image }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=${{ matrix.app }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUBLISH == 'true'

      - name: Sign (keyless)
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}"

      # Matrix legs cannot share job outputs reliably, so each leg leaves its pinned reference as an artifact.
      - name: Record digest
        if: env.PUBLISH == 'true'
        run: echo "${{ steps.name.outputs.image }}@${{ steps.push.outputs.digest }}" > "digest-${{ matrix.app }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.app }}
          path: digest-${{ matrix.app }}
          retention-days: 1

  manifest:
    name: Release manifest
    needs: image
    if: needs.image.result == 'success' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true
      # deploy/runbooks/release.md: git SHA, both image digests and the latest Flyway version.
      - name: Write manifest
        run: |
          BACKEND=$(cat digest-backend); FRONTEND=$(cat digest-frontend)
          case "$BACKEND$FRONTEND" in *@sha256:*@sha256:*) ;; *) echo "missing digest" >&2; exit 1 ;; esac
          flyway=$(ls backend/src/main/resources/db/migration | sed -E 's/^V([0-9]+)__.*/\1/' | sort -n | tail -1)
          {
            echo "# Satır release ${SOURCE_SHA}"
            echo "# Copy into /etc/satir/release.env (see deploy/runbooks/release.md). Latest Flyway migration: V${flyway}"
            echo "BACKEND_IMAGE=${BACKEND}"
            echo "FRONTEND_IMAGE=${FRONTEND}"
            echo "APP_RELEASE=${SOURCE_SHA}"
          } > release-manifest.env
          { echo '```'; cat release-manifest.env; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ env.SOURCE_SHA }}
          path: release-manifest.env
          retention-days: 90
